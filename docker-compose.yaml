
services:
  backend:
    container_name: face-editor-backend

    image: python:3.11-slim

    working_dir: /app

    volumes:
      - ./backend:/app

    ports:
      - "8000:8000"

    tty: true

    stdin_open: true

    command: sh -c "while sleep 1000; do :; done"


  frontend:
    container_name: face-editor-frontend
    image: node:20
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    tty: true
    stdin_open: true
    command: sh -c "while sleep 1000; do :; done"